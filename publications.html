<!-- =========================================================
     PUBLICATION SCRIPT
     ========================================================= -->

<script>


document.addEventListener(
    "DOMContentLoaded",
    async function () {


        /* =====================================================
           HTML ELEMENTS
           ===================================================== */

        const publicationList =
            document.getElementById(
                "publication-list"
            );


        const loadingMessage =
            document.getElementById(
                "publication-loading"
            );


        const publicationSummary =
            document.getElementById(
                "publication-summary"
            );


        try {


            /* =================================================
               1. READ THE BIBTEX FILE
               ================================================= */

            const response =
                await fetch(
                    "assets/files/publications.bib"
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to load publications.bib"
                );

            }


            const bibtexText =
                await response.text();



            /* =================================================
               2. PARSE BIBTEX
               ================================================= */

            const publications =
                bibtexParse.toJSON(
                    bibtexText
                );



            /* =================================================
               3. SORT BY YEAR

               Newest publications appear first.
               ================================================= */

            publications.sort(
                function (a, b) {

                    const yearA =
                        parseInt(
                            a.entryTags.year || 0
                        );


                    const yearB =
                        parseInt(
                            b.entryTags.year || 0
                        );


                    return yearB - yearA;

                }
            );



            /* =================================================
               4. REMOVE LOADING MESSAGE
               ================================================= */

            loadingMessage.style.display =
                "none";



            /* =================================================
               5. PUBLICATION COUNT
               ================================================= */

            publicationSummary.textContent =
                publications.length +
                (
                    publications.length === 1
                    ? " publication"
                    : " publications"
                );


            publicationSummary.style.display =
                "block";



            /* =================================================
               Used to determine when a new year heading
               should be displayed.
               ================================================= */

            let currentYear = null;



            /* =================================================
               6. CREATE PUBLICATION CARDS
               ================================================= */

            publications.forEach(
                function (publication) {


                    const tags =
                        publication.entryTags || {};


                    const year =
                        tags.year || "Other";



                    /* =========================================
                       YEAR HEADING

                       Example:

                       2026
                       -----------------

                       publication cards...
                       ========================================= */

                    if (year !== currentYear) {


                        currentYear = year;


                        const yearHeading =
                            document.createElement(
                                "h2"
                            );


                        yearHeading.className =
                            "publication-year";


                        yearHeading.textContent =
                            year;


                        publicationList.appendChild(
                            yearHeading
                        );

                    }



                    /* =========================================
                       DETERMINE PUBLICATION TYPE
                       ========================================= */

                    const entryType =
                        (
                            publication.entryType || ""
                        ).toLowerCase();


                    let typeLabel =
                        "Publication";


                    if (
                        entryType === "article"
                    ) {

                        typeLabel =
                            "Journal Article";

                    }


                    else if (
                        entryType === "inproceedings" ||
                        entryType === "conference"
                    ) {

                        typeLabel =
                            "Conference Paper";

                    }


                    else if (
                        entryType === "incollection"
                    ) {

                        typeLabel =
                            "Book Chapter";

                    }


                    else if (
                        entryType === "phdthesis"
                    ) {

                        typeLabel =
                            "Ph.D. Thesis";

                    }


                    else if (
                        entryType === "mastersthesis"
                    ) {

                        typeLabel =
                            "Master's Thesis";

                    }


                    else if (
                        entryType === "techreport"
                    ) {

                        typeLabel =
                            "Technical Report";

                    }


                    else if (
                        entryType === "misc"
                    ) {

                        typeLabel =
                            "Manuscript";

                    }



                    /* =========================================
                       PUBLICATION CARD
                       ========================================= */

                    const article =
                        document.createElement(
                            "article"
                        );


                    article.className =
                        "card pub-item";



                    /* =========================================
                       META INFORMATION

                       Example:
                       2026 · Journal Article · Under Review
                       ========================================= */

                    const metadata =
                        document.createElement(
                            "div"
                        );


                    metadata.className =
                        "pub-meta";


                    let metaText =
                        year +
                        " · " +
                        typeLabel;


                    if (
                        tags.status &&
                        tags.status.trim() !== ""
                    ) {

                        metaText +=
                            " · " +
                            cleanBibTex(
                                tags.status
                            );

                    }


                    metadata.textContent =
                        metaText;



                    /* =========================================
                       TITLE
                       ========================================= */

                    const title =
                        document.createElement(
                            "h2"
                        );


                    title.textContent =
                        cleanBibTex(
                            tags.title ||
                            "Untitled publication"
                        );



                    /* =========================================
                       AUTHORS
                       ========================================= */

                    const authors =
                        document.createElement(
                            "p"
                        );


                    authors.className =
                        "publication-authors";


                    authors.innerHTML =
                        formatAuthors(
                            tags.author || ""
                        );



                    /* =========================================
                       JOURNAL / CONFERENCE INFORMATION
                       ========================================= */

                    const venue =
                        document.createElement(
                            "p"
                        );


                    venue.className =
                        "publication-venue";


                    const venueHTML =
                        createVenueText(
                            tags
                        );


                    venue.innerHTML =
                        venueHTML;



                    /* =========================================
                       LINKS

                       PDF
                       DOI
                       Code
                       Project
                       Video
                       Preprint
                       ========================================= */

                    const links =
                        document.createElement(
                            "div"
                        );


                    links.className =
                        "pub-links";



                    addPublicationLink(
                        links,
                        "PDF",
                        tags.pdf
                    );


                    addPublicationLink(
                        links,
                        "DOI",
                        normalizeDOI(
                            tags.doi
                        )
                    );


                    addPublicationLink(
                        links,
                        "Code",
                        tags.code
                    );


                    addPublicationLink(
                        links,
                        "Project",
                        tags.project
                    );


                    addPublicationLink(
                        links,
                        "Video",
                        tags.video
                    );


                    addPublicationLink(
                        links,
                        "Preprint",
                        tags.preprint
                    );



                    /* =========================================
                       BUILD CARD
                       ========================================= */

                    article.appendChild(
                        metadata
                    );


                    article.appendChild(
                        title
                    );


                    if (
                        tags.author &&
                        tags.author.trim() !== ""
                    ) {

                        article.appendChild(
                            authors
                        );

                    }


                    if (
                        venueHTML !== ""
                    ) {

                        article.appendChild(
                            venue
                        );

                    }


                    if (
                        links.children.length > 0
                    ) {

                        article.appendChild(
                            links
                        );

                    }



                    /* =========================================
                       ADD CARD TO PAGE
                       ========================================= */

                    publicationList.appendChild(
                        article
                    );


                }
            );



            /* =================================================
               NO PUBLICATIONS FOUND
               ================================================= */

            if (
                publications.length === 0
            ) {


                const emptyMessage =
                    document.createElement(
                        "div"
                    );


                emptyMessage.className =
                    "callout";


                emptyMessage.textContent =
                    "No publications have been added yet.";


                publicationList.appendChild(
                    emptyMessage
                );

            }


        }


        /* =====================================================
           ERROR HANDLING
           ===================================================== */

        catch (error) {


            console.error(
                "Publication loading error:",
                error
            );


            loadingMessage.innerHTML = `

                <strong>
                    Publications could not be loaded.
                </strong>

                <br><br>

                Make sure the following file exists:

                <br>

                <code>
                    assets/files/publications.bib
                </code>

            `;

        }


    }
);



/* =============================================================
   CLEAN BASIC BIBTEX FORMATTING
   ============================================================= */

function cleanBibTex(text) {


    if (!text) {

        return "";

    }


    return text

        .replace(
            /[{}]/g,
            ""
        )

        .replace(
            /~/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}



/* =============================================================
   FORMAT AUTHORS
   ============================================================= */

function formatAuthors(
    authorString
) {


    if (!authorString) {

        return "";

    }


    const authors =
        authorString.split(
            /\s+and\s+/i
        );


    return authors

        .map(
            function (author) {


                author =
                    cleanBibTex(
                        author.trim()
                    );


                /*
                 * Automatically bold your name.
                 *
                 * Add other forms here if your BibTeX
                 * sometimes stores your name differently.
                 */

                const lower =
                    author.toLowerCase();


                if (

                    lower.includes(
                        "rukesh prajapati"
                    )

                    ||

                    lower.includes(
                        "prajapati, rukesh"
                    )

                ) {


                    return (
                        "<strong>" +
                        author +
                        "</strong>"
                    );

                }


                return author;

            }
        )

        .join(", ");

}



/* =============================================================
   CREATE JOURNAL / CONFERENCE CITATION TEXT
   ============================================================= */

function createVenueText(
    tags
) {


    const parts = [];


    /* ---------------------------------------------------------
       Journal article
       --------------------------------------------------------- */

    if (tags.journal) {

        parts.push(

            "<em>" +
            cleanBibTex(
                tags.journal
            ) +
            "</em>"

        );

    }


    /* ---------------------------------------------------------
       Conference
       --------------------------------------------------------- */

    else if (tags.booktitle) {

        parts.push(

            "<em>" +
            cleanBibTex(
                tags.booktitle
            ) +
            "</em>"

        );

    }


    /* ---------------------------------------------------------
       Publisher
       --------------------------------------------------------- */

    else if (tags.publisher) {

        parts.push(

            "<em>" +
            cleanBibTex(
                tags.publisher
            ) +
            "</em>"

        );

    }



    /* ---------------------------------------------------------
       Volume
       --------------------------------------------------------- */

    if (tags.volume) {

        parts.push(
            "vol. " +
            cleanBibTex(
                tags.volume
            )
        );

    }



    /* ---------------------------------------------------------
       Issue
       --------------------------------------------------------- */

    if (tags.number) {

        parts.push(
            "no. " +
            cleanBibTex(
                tags.number
            )
        );

    }



    /* ---------------------------------------------------------
       Pages
       --------------------------------------------------------- */

    if (tags.pages) {


        const pages =
            cleanBibTex(
                tags.pages
            )

            .replace(
                /--/g,
                "–"
            );


        parts.push(
            "pp. " +
            pages
        );

    }



    return parts.join(
        ", "
    );

}



/* =============================================================
   ADD PUBLICATION LINK
   ============================================================= */

function addPublicationLink(
    container,
    label,
    url
) {


    if (!url) {

        return;

    }


    url =
        cleanBibTex(
            url
        );


    if (
        url === ""
    ) {

        return;

    }



    const link =
        document.createElement(
            "a"
        );


    link.className =
        "text-chip";


    link.href =
        url;


    link.target =
        "_blank";


    link.rel =
        "noopener noreferrer";


    link.textContent =
        label;


    container.appendChild(
        link
    );

}



/* =============================================================
   NORMALIZE DOI

   Allows either:

   doi = {10.1109/example}

   or

   doi = {https://doi.org/10.1109/example}
   ============================================================= */

function normalizeDOI(
    doi
) {


    if (!doi) {

        return "";

    }


    doi =
        cleanBibTex(
            doi
        );


    if (
        doi.startsWith(
            "https://"
        )

        ||

        doi.startsWith(
            "http://"
        )
    ) {

        return doi;

    }


    return (
        "https://doi.org/" +
        doi
    );

}
