<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <meta name="description"
          content="News and research updates">

    <title>
        News | Academic Robotics Portfolio
    </title>


    <link rel="stylesheet"
          href="assets/css/style.css">


    <script defer
            src="assets/js/site-config.js">
    </script>

    <script defer
            src="assets/js/news.js">
    </script>

    <script defer
            src="assets/js/main.js">
    </script>

    <script defer
            src="assets/js/news-render.js">
    </script>

</head>


<body>


<!-- =========================================================
     HEADER
     ========================================================= -->

<header class="site-header">

    <div class="nav-wrap">


        <a class="brand"
           href="index.html">

            <span class="brand-mark"
                  data-config="shortName">

                YN

            </span>

            <span data-config="name">

                Your Name

            </span>

        </a>


        <button class="menu-button"
                aria-label="Open navigation"
                aria-expanded="false">

            ☰

        </button>


        <nav class="site-nav"
             aria-label="Main navigation">

            <a href="index.html">
                Home
            </a>

            <a href="research.html">
                Research
            </a>

            <a href="publications.html">
                Publications
            </a>

            <a href="cv.html">
                CV
            </a>

            <a class="active"
               href="news.html">

                News

            </a>

            <a href="contact.html">
                Contact
            </a>

        </nav>


    </div>

</header>



<!-- =========================================================
     MAIN CONTENT
     ========================================================= -->

<main>


    <!-- =====================================================
         PAGE HEADING
         ===================================================== -->

    <div class="page-heading">

        <span class="kicker">
            Updates
        </span>

        <h1>
            News
        </h1>

        <p>
            Research updates, publications, awards,
            competitions, presentations, and other
            professional activities.
        </p>

    </div>



    <!-- =====================================================
         NEWS
         ===================================================== -->

    <section class="card content-card">

        <div class="card-body">


            <div class="section-header">

                <h2>
                    News & Highlights
                </h2>

            </div>


            <!--
                All news entries are automatically inserted
                here from assets/data/news.js
            -->

            <div class="news-list"
                 id="full-news-list">
            </div>


        </div>

    </section>


</main>



<!-- =========================================================
     FOOTER
     ========================================================= -->

<footer class="site-footer">

    <div class="footer-wrap">

        <span>

            ©
            <span data-current-year></span>

            <span data-config="name">
                Your Name
            </span>

        </span>


        <span data-config="footerLine">

            Robotics · Autonomous Systems ·
            Computer Vision · Embodied AI

        </span>

    </div>

</footer>


</body>

</html>
